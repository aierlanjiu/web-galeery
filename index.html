        const PromptEditor = ({ isOpen, onClose, initialPrompt, onSave }) => {
            const [sections, setSections] = useState([]);
            const [fullPrompt, setFullPrompt] = useState(initialPrompt || '');
            const [copied, setCopied] = useState(false);

            useEffect(() => {
                if (isOpen) {
                    document.body.style.overflow = 'hidden';
                    if (initialPrompt) parsePrompt(initialPrompt);
                } else {
                    document.body.style.overflow = 'unset';
                }
                return () => { document.body.style.overflow = 'unset'; };
            }, [isOpen, initialPrompt]);

            const parsePrompt = (text) => {
                // Split by section headers: // --- SECTION NAME ---
                const sectionRegex = /(\/\/ --- .+ ---)/g;
                const parts = text.split(sectionRegex);

                let parsedSections = [];
                let currentHeader = "PREAMBLE";

                for (let i = 0; i < parts.length; i++) {
                    const part = parts[i].trim();
                    if (!part) continue;

                    if (part.startsWith("// ---")) {
                        currentHeader = part;
                    } else {
                        parsedSections.push({
                            header: currentHeader,
                            content: part
                        });
                    }
                }
                setSections(parsedSections);
                setFullPrompt(text);
            };

            const handleSectionChange = (index, newContent) => {
                const updatedSections = [...sections];
                updatedSections[index].content = newContent;
                setSections(updatedSections);

                // Reconstruct full prompt
                const newFullPrompt = updatedSections.map(s => `${s.header}\n\n${s.content}`).join('\n\n');
                setFullPrompt(newFullPrompt);
            };

            const handleCopy = () => {
                navigator.clipboard.writeText(fullPrompt);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            if (!isOpen) return null;

            return (
                <motion.div
                    initial={{ opacity: 0 }}
                    animate={{ opacity: 1 }}
                    exit={{ opacity: 0 }}
                    className="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-8 bg-black/80 backdrop-blur-xl"
                >

                        initial={{ scale: 0.9, y: 20 }}

                                <p className="font-mono text-[10px] text-va-dark/50 dark:text-white/40 tracking-tighter">STRUCTURAL DECOMPOSITION & CUSTOMIZATION</p>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-black/5 dark:hover:bg-white/10 rounded-full transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 text-va-dark dark:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>

                        {/* Editor Body */}
                        <div className="flex-grow overflow-y-auto p-6 space-y-8 custom-scrollbar">
                            {sections.map((section, idx) => (
                                <div key={idx} className="space-y-3">
                                    <div className="flex items-center gap-2">
                                        <div className="h-px flex-grow bg-va-dark/10 dark:bg-white/10"></div>
                                        <span className="font-mono text-[10px] font-bold text-va-gold uppercase tracking-widest">{section.header.replace(/\/\/ --- | ---/g, '')}</span>
                                        <div className="h-px flex-grow bg-va-dark/10 dark:bg-white/10"></div>
                                    </div>
                                    <textarea
                                        value={section.content}
                                        onChange={(e) => handleSectionChange(idx, e.target.value)}

                                        spellCheck="false"
                                    />
                                </div>
                            ))}
                        </div>

                        {/* Footer / Actions */}

                                    `}

                                    {copied ? 'COPIED' : 'COPY PROMPT'}
                                </button>
                            </div>

                    </motion.div>

                        className="bg-[#ffedd5] dark:bg-slate-700 text-va-dark dark:text-white p-4 rounded-full shadow-lg border border-va-dark/5 hover:shadow-xl transition-all flex items-center gap-2 group"
                    >
                        <span className="text-xl">☕</span>
                        <span className="max-w-0 overflow-hidden group-hover:max-w-xs transition-all duration-300 font-bold text-xs whitespace-nowrap">
                            请作者喝咖啡
                        </span>
                    </motion.button>
                </div>
            );
        };

        const App = () => {
            const [data, setData] = useState([]);
            const [filteredData, setFilteredData] = useState([]);
            const [filter, setFilter] = useState('all');
            const [loading, setLoading] = useState(true);
            const [categories, setCategories] = useState([]);
            const [isMobile, setIsMobile] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [editorOpen, setEditorOpen] = useState(false);
            const [editingPrompt, setEditingPrompt] = useState('');
            const [isCoCreationOpen, setIsCoCreationOpen] = useState(false);
            const [isDataOpen, setIsDataOpen] = useState(false);
            const [latestNews, setLatestNews] = useState(null);
            const [wechatData, setWechatData] = useState(null);
            const [visibleCount, setVisibleCount] = useState(12);

            const toggleTheme = () => setIsDarkMode(!isDarkMode);

            const openEditor = (prompt) => {
                setEditingPrompt(prompt);
                setEditorOpen(true);
            };

            useEffect(() => {
                // Check mobile
                const checkMobile = () => setIsMobile(window.innerWidth < 768);
                checkMobile();
                window.addEventListener('resize', checkMobile);

                // Fetch asset data
                fetch(`./web_data.json?t=${new Date().getTime()}`)
                    .then(res => res.json())
                    .then(jsonData => {
                        setData(jsonData);
                        setFilteredData(jsonData);

                        // Extract unique categories
                        const cats = [...new Set(jsonData.map(item => item.category))].filter(Boolean).sort();
                        setCategories(cats);

                        setLoading(false);
                    })
                    .catch(err => {
                        console.error("Failed to load data", err);
                        setLoading(false);
                    });

                // Fetch news data for ticker
                fetch('./news_data.json')
                    .then(res => res.json())
                    .then(newsData => {
                        if (newsData && newsData.length > 0) {
                            setLatestNews(newsData[0]);
                        }
                    })
                    .catch(err => console.error("Failed to load news", err));

                // Fetch WeChat data
                fetch('./wechat_data.json')
                    .then(res => res.json())
                    .then(wxData => {
                        setWechatData(wxData);
                    })
                    .catch(err => console.error("Failed to load wechat data", err));

                return () => window.removeEventListener('resize', checkMobile);
            }, []);

            useEffect(() => {
                setVisibleCount(12); // Reset pagination on filter change
                if (filter === 'all') {
                    setFilteredData(data);
                } else {
                    setFilteredData(data.filter(item => item.category === filter));
                }
            }, [filter, data]);

            return (
                <div className={`${isDarkMode ? 'dark' : ''}`}>
                    <div className="min-h-screen flex flex-col relative transition-colors duration-500 bg-[#E8EAE6] dark:bg-[#0f172a] text-[#2C3E50] dark:text-[#E2E8F0] overflow-hidden">

                        {/* Dynamic Image Background */}
                        <div className="fixed inset-0 z-0 transition-opacity duration-1000">
                            <img
                                src={isDarkMode ? './images/bg-night.png' : './images/bg-day.png'}
                                alt="Background"
                                className="w-full h-full object-cover opacity-40 blur-[4px] scale-110"
                            />
                            <div className="absolute inset-0 bg-gradient-to-b from-[#0f172a]/90 via-[#0f172a]/80 to-[#020617] dark:from-[#0f172a]/90 dark:via-[#0f172a]/80 dark:to-[#020617] from-white/80 via-white/50 to-slate-100/90"></div>
                        </div>

                        {/* Animated Background Grid (Overlay) */}
                        <div className={`cyber-grid animate-grid-flow transition-opacity duration-500 absolute inset-0 z-0 pointer-events-none opacity-20`}></div>

                        {/* Ambient Orbs (Atmosphere) */}
                        <div className="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
                            <div className="absolute top-[-10%] left-[-10%] w-[40rem] h-[40rem] bg-indigo-900/30 rounded-full blur-[120px] animate-pulse mix-blend-screen"></div>
                            <div className="absolute top-[20%] right-[-10%] w-[35rem] h-[35rem] bg-blue-900/20 rounded-full blur-[120px] animate-pulse mix-blend-screen" style={{ animationDelay: '2s' }}></div>
                            <div className="absolute bottom-[-10%] left-[20%] w-[45rem] h-[45rem] bg-va-accent/10 rounded-full blur-[120px] animate-pulse mix-blend-screen" style={{ animationDelay: '4s' }}></div>
                        </div>

                        <div className="relative z-10">
                            <Header
                                totalCount={data.length.toString().padStart(2, '0')}
                                isDarkMode={isDarkMode}
                                toggleTheme={toggleTheme}
                                latestNews={latestNews}
                                wechatData={wechatData}
                                onOpenData={() => setIsDataOpen(true)}
                            />

                            <CoCreationWidget onOpen={() => setIsCoCreationOpen(true)} />

                            <AnimatePresence>
                                {isCoCreationOpen && (
                                    <CoCreationModal
                                        isOpen={isCoCreationOpen}
                                        onClose={() => setIsCoCreationOpen(false)}
                                    />
                                )}
                            </AnimatePresence>

                            <AnimatePresence>
                                {isDataOpen && (
                                    <DataDashboard
                                        isOpen={isDataOpen}
                                        onClose={() => setIsDataOpen(false)}
                                    />
                                )}
                            </AnimatePresence>

                            <Toolbox isDarkMode={isDarkMode} />



                            <FilterBar activeFilter={filter} setFilter={setFilter} categories={categories} />



                            <main className="flex-grow max-w-7xl mx-auto px-4 md:px-5 w-full">

                                {loading ? (

                                    <div className="flex justify-center items-center h-64 font-mono text-va-accent animate-pulse">

                                        数据流加载中 (INITIALIZING)...

                                    </div>

                                ) : (
                                    <>
                                        <div className="columns-1 md:columns-2 lg:columns-3 gap-8 space-y-8">
                                            <AnimatePresence mode="popLayout">

                                                {filteredData.slice(0, visibleCount).map((item, index) => (

                                                    <Card
                                                        key={`${item.title}-${index}`}
                                                        item={item}
                                                        index={index}
                                                        isMobile={isMobile}
                                                        onEdit={openEditor}
                                                    />

                                                ))}

                                            </AnimatePresence>

                                        </div>

                                        {visibleCount < filteredData.length && (
                                            <div className="flex justify-center mt-12 mb-8">
                                                <button
                                                    onClick={() => setVisibleCount(prev => prev + 12)}
                                                    className="group relative px-8 py-3 bg-va-card dark:bg-slate-800 border border-va-dark/10 dark:border-white/10 rounded-full font-mono text-xs font-bold text-va-dark dark:text-slate-300 tracking-widest hover:bg-va-dark hover:text-white dark:hover:bg-white dark:hover:text-va-dark transition-all duration-300 shadow-lg hover:shadow-xl hover:scale-105"
                                                >
                                                    <span className="flex items-center gap-2">
                                                        加载更多 // LOAD MORE [{filteredData.length - visibleCount}]
                                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4 group-hover:animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                                                        </svg>
                                                    </span>
                                                </button>
                                            </div>
                                        )}
                                    </>
                                )}

                            </main>
                            <AnimatePresence>
                                {editorOpen && (
                                    <PromptEditor
                                        isOpen={editorOpen}
                                        onClose={() => setEditorOpen(false)}
                                        initialPrompt={editingPrompt}
                                        onSave={(newPrompt) => {
                                            // For now, we just copy to clipboard and close
                                            navigator.clipboard.writeText(newPrompt);
                                            setEditorOpen(false);
                                        }}
                                    />
                                )}
                            </AnimatePresence>
                            <PromotionBanner />

                            <Footer />
                            <BackToTopButton />
                            <CoffeeButton />

                        </div>
                    </div>

                </div>

            );

        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
