<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,height=device-height,initial-scale=1.0">
<title>雪沐江南 · 智能驾驶概念图谱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a1f3d}

#stage{position:absolute;inset:0;overflow:hidden}

/* ── Phase 1: 7×3 画廊墙 ── */
#wall{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 45%,#152a4a 0%,#0a1f3d 70%);
}

#wall-title{
  font-family:'Noto Serif SC',serif;font-weight:700;
  font-size:2.6vw;letter-spacing:.06em;color:rgba(241,243,245,.92);
  margin-bottom:1.2vh;opacity:0;transform:translateY(-1vh);
}
#wall-sub{
  font-family:'IBM Plex Mono',monospace;font-size:0.78vw;
  letter-spacing:.3em;text-transform:uppercase;
  color:rgba(241,243,245,.38);margin-bottom:1.6vh;
  opacity:0;transform:translateY(-1vh);
}
.show{animation:fadeDown .6s cubic-bezier(.16,1,.3,1) both}
@keyframes fadeDown{0%{opacity:0;transform:translateY(-2vh)}100%{opacity:1;transform:translateY(0)}}

#gallery{
  display:grid;grid-template-columns:repeat(7,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:1.2vh 1vw;width:82vw;height:54vh;
  perspective:1600px;perspective-origin:50% 45%;
}
#gallery.off{opacity:0;transition:opacity .45s ease}

.card{
  position:relative;border-radius:6px;overflow:hidden;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  opacity:0;transform:scale(.88) translateY(3vh);
}
.card img{width:100%;height:100%;object-fit:contain;display:block;background:rgba(10,31,61,.6)}
.card .lbl{
  position:absolute;bottom:0;left:0;right:0;
  padding:0.4vh 0.3vw;
  background:linear-gradient(transparent,rgba(10,31,61,.82));
  font-family:'IBM Plex Mono',monospace;font-size:6px;
  letter-spacing:.14em;text-transform:uppercase;
  color:rgba(241,243,245,.5);
}
.card.in{animation:cardIn .45s cubic-bezier(.16,1,.3,1) both}
@keyframes cardIn{0%{opacity:0;transform:scale(.86) translateY(4vh)}100%{opacity:1;transform:scale(1) translateY(0)}}

/* ── Phase 2: 3-Card Bridge ── */
#bridge{
  position:absolute;inset:0;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 45%,#152a4a 0%,#0a1f3d 70%);
  gap:2vh;
}
#bridge.on{display:flex}

#bridge-row{display:flex;gap:5vw;align-items:flex-start}
.b-card{
  width:20vw;border-radius:10px;overflow:hidden;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 20px 50px -16px rgba(0,0,0,.35);
  opacity:0;transform:translateY(5vh);
}
.b-card img{width:100%;aspect-ratio:3/4;object-fit:contain;display:block;background:rgba(10,31,61,.4)}
.b-card .b-cap{
  padding:1.2vh 1vw;font-family:'Noto Serif SC',serif;
  font-size:0.9vw;text-align:center;color:rgba(241,243,245,.75);
  letter-spacing:.04em;background:rgba(10,31,61,.5);
}
.b-card.in{animation:bridgeIn .55s cubic-bezier(.16,1,.3,1) both}
@keyframes bridgeIn{0%{opacity:0;transform:translateY(5vh)}100%{opacity:1;transform:translateY(0)}}

#bridge-title{
  font-family:'Noto Serif SC',serif;font-weight:700;
  font-size:2vw;letter-spacing:.06em;color:rgba(241,243,245,.85);
  opacity:0;
}
#bridge-title.show{animation:fadeDown .5s .2s cubic-bezier(.16,1,.3,1) both}

#stage.fade-out{opacity:0;transition:opacity .5s ease}
</style>
</head>
<body>
<div id="stage">
  <div id="wall">
    <div id="wall-title">智能驾驶 · 概念拆解图谱</div>
    <div id="wall-sub">Xuemu Lab · Visual Architecture</div>
    <div id="gallery"></div>
  </div>

  <div id="bridge">
    <div id="bridge-title">三重视角</div>
    <div id="bridge-row">
      <div class="b-card" id="b0"><img src=""><div class="b-cap"></div></div>
      <div class="b-card" id="b1"><img src=""><div class="b-cap"></div></div>
      <div class="b-card" id="b2"><img src=""><div class="b-cap"></div></div>
    </div>
  </div>
</div>

<script>
const IMAGES=[
  "GPS北斗伽利略格洛纳斯","GNSS卫星定位","IMU惯性测量单元",
  "RTK差分定位","SLAM建图","Tops（算力单位）",
  "点云密度","定位算法","FPGA",
  "感知融合","后融合","DRAM带宽。",
  "角分辨率","目标检测","前融合",
  "视场角（FOV）","算法与数据","探测距离",
  "信噪比","域控制器水冷风冷","帧率"
];

const LABELS={
  "GPS北斗伽利略格洛纳斯":"GNSS · 伽利略","GNSS卫星定位":"GNSS · 定位",
  "IMU惯性测量单元":"IMU · 惯导","RTK差分定位":"RTK · 差分",
  "SLAM建图":"SLAM · 建图","Tops（算力单位）":"算力 · TOPS",
  "点云密度":"点云密度","定位算法":"定位算法","FPGA":"FPGA",
  "感知融合":"感知融合","后融合":"后融合","DRAM带宽。":"DRAM 带宽",
  "角分辨率":"角分辨率","目标检测":"目标检测","前融合":"前融合",
  "视场角（FOV）":"视场角","算法与数据":"算法与数据","探测距离":"探测距离",
  "信噪比":"信噪比","域控制器水冷风冷":"域控制器","帧率":"帧率"
};

const BRIDGE_IMGS=["前融合","GNSS卫星定位","目标检测"];
const BRIDGE_LABELS=["前融合 · 多传感器数据","GNSS · 高精卫星定位","目标检测 · 视觉感知"];

const gallery=document.getElementById('gallery');
const cards=[];

// Build 7×3 grid
IMAGES.forEach((name,i)=>{
  const div=document.createElement('div');
  div.className='card';div.dataset.idx=i;
  const img=document.createElement('img');
  img.src='images/gallery/'+name+'.jpg';
  const lbl=document.createElement('span');
  lbl.className='lbl';lbl.textContent=(LABELS[name]||name);
  div.appendChild(img);div.appendChild(lbl);
  gallery.appendChild(div);
  cards.push(div);
});

// Set bridge images
BRIDGE_IMGS.forEach((name,i)=>{
  const c=document.getElementById('b'+i);
  c.querySelector('img').src='images/gallery/'+name+'.jpg';
  c.querySelector('.b-cap').textContent=BRIDGE_LABELS[i];
});

// ── Ripple entrance (center-out on 7×3 grid) ──
const COLS=7,ROWS=3;
const cx=3,cy=1; // center: col3 row1
const dists=cards.map((_,i)=>{
  const col=i%COLS,row=Math.floor(i/COLS);
  return Math.sqrt((col-cx)**2+(row-cy)**2);
});
const maxD=Math.max(...dists);

cards.forEach((card,i)=>{
  const delay=80+(dists[i]/maxD)*750;
  setTimeout(()=>card.classList.add('in'),delay);
});

// Title
setTimeout(()=>document.getElementById('wall-title').classList.add('show'),500);
setTimeout(()=>document.getElementById('wall-sub').classList.add('show'),750);

// ── Switch to 3-card bridge ──
setTimeout(()=>{
  document.getElementById('gallery').classList.add('off');
  document.getElementById('bridge').classList.add('on');
  document.getElementById('bridge-title').classList.add('show');
  ['b0','b1','b2'].forEach((id,i)=>{
    setTimeout(()=>document.getElementById(id).classList.add('in'),150+i*180);
  });
},2600);

// ── Fade out ──
setTimeout(()=>document.getElementById('stage').classList.add('fade-out'),4500);

// Signal
setTimeout(()=>{window.__ready=true},200);
</script>
</body>
</html>
