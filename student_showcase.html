<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <script>
        (function () {
            function loadUmami() {
                window.setTimeout(function () {
                    var script = document.createElement('script');
                    script.src = 'https://cloud.umami.is/script.js';
                    script.async = true;
                    script.setAttribute('data-website-id', '4c8af0ff-2c1f-44b7-8be6-e10b40863459');
                    script.onerror = function () {
                        if (script.parentNode) script.parentNode.removeChild(script);
                    };
                    document.head.appendChild(script);
                }, 1200);
            }
            if (document.readyState === 'complete') {
                loadUmami();
            } else {
                window.addEventListener('load', loadUmami);
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT SHOWCASE | 光影特训营作品展</title>

    <script crossorigin src="./vendor/react.production.min.js"></script>
    <script crossorigin src="./vendor/react-dom.production.min.js"></script>
    <script src="./vendor/babel.min.js"></script>
    <script src="./vendor/tailwindcss-3.4.17.js"></script>
    <script src="./vendor/framer-motion.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Oswald:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'va-base': '#060b1a',
                        'va-glass': 'rgba(255,255,255,0.04)',
                        'va-glass-hover': 'rgba(255,255,255,0.10)',
                        'va-border': 'rgba(255,255,255,0.10)',
                        'va-accent': '#5cd8e6',
                        'va-violet': '#8b9cf7',
                        'va-warm': '#f0b458',
                        'va-ink': '#f0ece4',
                        'va-muted': '#7a8a9a',
                    },
                    fontFamily: {
                        display: ['Oswald', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        body: ['Noto Sans SC', 'sans-serif'],
                    },
                    animation: {
                        'blob1': 'blob1 20s ease-in-out infinite',
                        'blob2': 'blob2 25s ease-in-out infinite',
                        'blob3': 'blob3 30s ease-in-out infinite',
                    },
                    keyframes: {
                        blob1: {
                            '0%, 100%': { borderRadius: '40% 60% 60% 40% / 40% 60% 40% 60%', transform: 'translate(0, 0) rotate(0deg) scale(1)' },
                            '33%': { borderRadius: '60% 40% 40% 60% / 60% 40% 60% 40%', transform: 'translate(3%, -2%) rotate(120deg) scale(1.05)' },
                            '66%': { borderRadius: '50% 50% 40% 60% / 30% 60% 50% 70%', transform: 'translate(-2%, 3%) rotate(240deg) scale(0.95)' },
                        },
                        blob2: {
                            '0%, 100%': { borderRadius: '60% 40% 30% 70% / 60% 30% 70% 40%', transform: 'translate(0, 0) rotate(0deg) scale(1)' },
                            '50%': { borderRadius: '30% 60% 70% 40% / 50% 60% 30% 60%', transform: 'translate(-4%, 5%) rotate(-180deg) scale(1.08)' },
                        },
                        blob3: {
                            '0%, 100%': { borderRadius: '50% 50% 50% 50% / 50% 50% 50% 50%', transform: 'translate(0, 0) rotate(0deg) scale(1)' },
                            '25%': { borderRadius: '70% 30% 50% 50% / 30% 70% 50% 50%', transform: 'translate(5%, 3%) rotate(90deg) scale(0.93)' },
                            '75%': { borderRadius: '30% 70% 50% 50% / 70% 30% 50% 50%', transform: 'translate(-3%, -5%) rotate(270deg) scale(1.07)' },
                        },
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #060b1a;
            color: #f0ece4;
            font-family: 'Noto Sans SC', sans-serif;
            overflow-x: hidden;
        }

        .liquid-stage {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        .liquid-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.28;
            will-change: transform, border-radius;
        }
        .liquid-blob-1 {
            width: 50vw; height: 50vw; max-width: 800px; max-height: 800px;
            background: radial-gradient(circle at 30% 30%, #5cd8e6, #3b82f6);
            top: -10%; left: -5%;
        }
        .liquid-blob-2 {
            width: 40vw; height: 40vw; max-width: 600px; max-height: 600px;
            background: radial-gradient(circle at 60% 40%, #8b9cf7, #6366f1);
            top: 35%; right: -8%;
        }
        .liquid-blob-3 {
            width: 35vw; height: 35vw; max-width: 500px; max-height: 500px;
            background: radial-gradient(circle at 50% 50%, #f0b458, #d97706);
            bottom: -8%; left: 25%; opacity: 0.12;
        }

        .glass {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.10);
        }
        .glass-strong {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255,255,255,0.14);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion } = window.Motion;

        const Card = ({ item, index }) => {
            return (
                <motion.div
                    initial={{ opacity: 0, y: 30 }}
                    animate={{ opacity: 1, y: 0 }}
                    transition={{ delay: index * 0.1 }}
                    className="mb-8 break-inside-avoid"
                >
                    <div className="glass rounded-2xl overflow-hidden group hover:bg-white/[0.07] hover:border-white/20 hover:-translate-y-1 transition-all duration-500 shadow-xl">
                        <div className="relative aspect-auto overflow-hidden bg-white/[0.02]">
                            <img
                                src={item.src}
                                alt={item.title}
                                className="w-full h-auto object-cover transition-transform duration-700 group-hover:scale-[1.03]"
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-[#060b1a]/60 via-transparent to-transparent opacity-50"></div>
                        </div>
                        <div className="p-5">
                            <div className="flex justify-between items-center mb-3">
                                <span className="font-mono text-[10px] text-va-accent tracking-widest">PROJECT // {(index + 1).toString().padStart(3, '0')}</span>
                                <span className="px-2 py-0.5 rounded-full bg-va-accent/10 border border-va-accent/20 text-va-accent font-mono text-[10px]">VERIFIED</span>
                            </div>
                            <h3 className="font-display text-lg font-bold text-white mb-2 group-hover:text-va-accent transition-colors">{item.title}</h3>
                            <p className="text-sm text-white/40 font-body leading-relaxed line-clamp-3">
                                {item.description}
                            </p>
                        </div>
                    </div>
                </motion.div>
            );
        };

        const StudentLink = ({ name, url, icon }) => (
            <a
                href={url}
                target="_blank"
                rel="noopener noreferrer"
                className="flex items-center gap-4 p-4 glass rounded-2xl border-white/10 hover:bg-white/10 hover:border-va-accent/30 transition-all group"
            >
                <div className="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
                    {icon}
                </div>
                <div className="flex flex-col">
                    <span className="text-xs font-mono text-white/40 uppercase tracking-tighter">Contributor</span>
                    <span className="text-sm font-bold text-white group-hover:text-va-accent transition-colors">{name}</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4 ml-auto text-white/20 group-hover:text-va-accent transform group-hover:translate-x-1 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </a>
        );

        const App = () => {
            const [works, setWorks] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                fetch('student_works.json?v=' + new Date().getTime())
                    .then(res => res.json())
                    .then(data => {
                        setWorks(data);
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error(err);
                        setLoading(false);
                    });
            }, []);

            return (
                <div className="min-h-screen relative pb-20">

                    <div className="liquid-stage">
                        <div className="liquid-blob liquid-blob-1 animate-blob1"></div>
                        <div className="liquid-blob liquid-blob-2 animate-blob2"></div>
                        <div className="liquid-blob liquid-blob-3 animate-blob3"></div>
                    </div>
                    <div className="fixed inset-0 pointer-events-none" style={{ background: 'radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(6,11,26,0.5) 100%)' }}></div>

                    <div className="relative z-10">
                        <header className="max-w-7xl mx-auto pt-16 px-6 mb-16 text-center">
                            <motion.div initial={{ opacity: 0, y: -20 }} animate={{ opacity: 1, y: 0 }}>
                                <a href="index.html" className="inline-flex items-center gap-2 text-va-accent font-mono text-xs mb-8 hover:underline">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                                    </svg>
                                    BACK TO CORE SYSTEM
                                </a>
                                <h1 className="font-display text-5xl md:text-7xl font-bold text-white mb-4 tracking-tighter">
                                    STUDENT <span className="text-va-accent">SHOWCASE</span>
                                </h1>
                                <p className="font-mono text-sm text-white/40 uppercase tracking-[0.3em]">
                                    光影特训营 · 学员作品展
                                </p>
                            </motion.div>

                            <motion.div
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                transition={{ delay: 0.5 }}
                                className="flex justify-center gap-8 mt-12 border-y border-white/10 py-6 max-w-2xl mx-auto"
                            >
                                <div className="text-center">
                                    <p className="text-2xl font-bold text-va-accent font-display">{works.length}</p>
                                    <p className="text-[10px] font-mono text-white/40 uppercase">Deliverables</p>
                                </div>
                                <div className="w-px h-10 bg-white/10"></div>
                                <div className="text-center">
                                    <p className="text-2xl font-bold text-va-warm font-display">1</p>
                                    <p className="text-[10px] font-mono text-white/40 uppercase">Spot Left</p>
                                </div>
                                <div className="w-px h-10 bg-white/10"></div>
                                <div className="text-center">
                                    <p className="text-2xl font-bold text-white font-display">V1.03</p>
                                    <p className="text-[10px] font-mono text-white/40 uppercase">Version</p>
                                </div>
                            </motion.div>
                        </header>

                        <main className="max-w-7xl mx-auto px-6">
                            {loading ? (
                                <div className="h-64 flex items-center justify-center font-mono text-va-accent/60">
                                    LOADING ASSETS...
                                </div>
                            ) : (
                                <div className="columns-1 md:columns-2 lg:columns-3 gap-8 space-y-8">
                                    {works.map((item, index) => (
                                        <Card key={item.id || index} item={item} index={index} />
                                    ))}
                                </div>
                            )}

                            <section className="mt-24 max-w-4xl mx-auto">
                                <h2 className="font-mono text-xs text-va-accent uppercase tracking-[0.4em] mb-8 flex items-center gap-4">
                                    <span className="w-8 h-px bg-va-accent/30"></span>
                                    Top Creators Community
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    <StudentLink
                                        name="光影下的秘密"
                                        url="https://xhslink.com/m/27r9CPBb1NU"
                                        icon="📸"
                                    />
                                    <StudentLink
                                        name="CFD技术应用之家"
                                        url="https://mp.weixin.qq.com/s/WgW4_Ss2EmeRpcE_RJXaNw"
                                        icon="🧬"
                                    />
                                </div>
                            </section>
                        </main>

                        <footer className="mt-24 text-center px-6">
                            <div className="max-w-5xl mx-auto relative overflow-hidden rounded-3xl glass border-white/10 group shadow-2xl">
                                <img
                                    src="./assets/promo_seats.webp"
                                    alt="Training Camp Enrollment"
                                    className="w-full h-auto object-cover relative z-0 group-hover:scale-[1.01] transition-transform duration-1000 opacity-90"
                                />
                                <div className="absolute inset-0 bg-gradient-to-t from-[#060b1a]/90 via-transparent to-transparent z-10 pointer-events-none"></div>
                                <div className="absolute bottom-0 left-0 right-0 p-8 md:p-10 z-20 flex flex-col md:flex-row items-center justify-between gap-6">
                                    <div className="text-left">
                                        <h2 className="font-display text-3xl md:text-4xl text-white mb-2 uppercase tracking-tighter">
                                            Join The <span className="text-va-accent">Elite</span> Group
                                        </h2>
                                        <p className="text-white/60 font-mono text-sm uppercase tracking-widest">
                                            光影特训营 · <span className="text-va-warm font-bold text-xl px-1">首期席位已满</span> (二期预约中)
                                        </p>
                                    </div>
                                    <a
                                        href="https://mp.weixin.qq.com/s/EmidUGyxo94euzRRM9oHLQ"
                                        className="px-10 py-4 bg-gradient-to-r from-va-accent to-va-violet text-white font-bold font-mono rounded-full hover:opacity-90 transition-all uppercase tracking-[0.2em] whitespace-nowrap shadow-lg"
                                    >
                                        Join The Waitlist
                                    </a>
                                </div>
                            </div>

                            <p className="mt-16 font-mono text-[10px] text-white/30 uppercase tracking-[0.5em]">
                                &copy; 2026 SNOWY LABS // ALL RIGHTS RESERVED
                            </p>
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
