<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>B2B 变现 · Art-Tech Swarm Financial Dashboard</title>
    <script src="./vendor/tailwindcss-3.4.17.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'va-base': '#0b1018', 'va-surface': '#111a26', 'va-card': '#162232',
                        'va-border': '#1e2d42', 'va-ink': '#eef2f6', 'va-muted': '#708498',
                        'va-accent': '#5b9cf5', 'va-profit': '#3ecf8e', 'va-warn': '#f59e0b',
                    },
                    fontFamily: {
                        display: ['Barlow Condensed', 'Noto Sans SC', 'sans-serif'],
                        ui: ['Rajdhani', 'Noto Sans SC', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        body: ['Noto Sans SC', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link rel="stylesheet" href="./styles/liquid-glass.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-border: rgba(91, 156, 245, 0.12);
            --glass-glow: rgba(91, 156, 245, 0.06);
            --glass-highlight: rgba(255, 255, 255, 0.03);
        }
        body { background: var(--va-base); color: var(--va-ink); font-family: 'Rajdhani', 'Noto Sans SC', sans-serif; overflow-x: hidden; }
        .glass-panel {
            background: linear-gradient(135deg, rgba(17,26,38,0.9) 0%, rgba(22,34,50,0.7) 100%);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 var(--glass-highlight);
        }
        .kpi-value { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; letter-spacing: -0.02em; }
        .kpi-label { font-family: 'Rajdhani', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.7rem; color: var(--va-muted); }
        .gradient-line { height: 1px; background: linear-gradient(90deg, transparent, var(--va-accent), transparent); opacity: 0.3; }
        .bar-fill { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--va-accent), #7cb8ff); transition: width 1.2s cubic-bezier(0.22,1,0.36,1); }
        .funnel-step { position: relative; padding: 16px 20px; background: linear-gradient(135deg, rgba(17,26,38,0.8), rgba(22,34,50,0.5)); border-left: 3px solid var(--va-accent); border-radius: 0 12px 12px 0; }
        .table-row { border-bottom: 1px solid rgba(30,45,66,0.5); }
        .table-row:last-child { border-bottom: none; }
        .profit-badge { background: linear-gradient(135deg, rgba(62,207,142,0.15), rgba(62,207,142,0.05)); border: 1px solid rgba(62,207,142,0.3); color: var(--va-profit); border-radius: 6px; padding: 2px 8px; font-size: 0.75rem; font-weight: 700; }
        .nav-back { display: inline-flex; align-items: center; gap: 6px; color: var(--va-muted); text-decoration: none; font-size: 0.8125rem; transition: color 0.2s; }
        .nav-back:hover { color: var(--va-accent); }
        .nav-back svg { width: 16px; height: 16px; }

        /* Login Screen */
        .login-scene { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
        .login-bg-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.12; pointer-events: none; }
        .login-card { position: relative; width: 420px; max-width: 90vw; padding: 48px 40px; text-align: center; }
        .login-card::before {
            content: ''; position: absolute; inset: -1px; border-radius: 17px; padding: 1px;
            background: linear-gradient(135deg, rgba(91,156,245,0.4), transparent 40%, transparent 60%, rgba(91,156,245,0.15));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none;
        }
        .login-input {
            width: 100%; padding: 14px 20px; background: rgba(11,16,24,0.8); border: 1px solid var(--glass-border);
            border-radius: 12px; color: var(--va-ink); font-size: 1rem; font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.15em; text-align: center; outline: none; transition: all 0.3s;
        }
        .login-input:focus { border-color: var(--va-accent); box-shadow: 0 0 20px rgba(91,156,245,0.15); }
        .login-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--va-accent), #3b7dd8);
            border: none; border-radius: 12px; color: #fff; font-family: 'Rajdhani', sans-serif;
            font-weight: 700; font-size: 0.9375rem; letter-spacing: 0.1em; cursor: pointer;
            transition: all 0.3s; text-transform: uppercase;
        }
        .login-btn:hover { box-shadow: 0 4px 24px rgba(91,156,245,0.3); transform: translateY(-1px); }
        .login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .login-error { color: #f87171; font-size: 0.8125rem; min-height: 1.25rem; margin-top: 8px; transition: opacity 0.2s; }
        .scanline { position: absolute; inset: 0; overflow: hidden; border-radius: 16px; pointer-events: none; }
        .scanline::after {
            content: ''; position: absolute; top: -100%; left: 0; right: 0; height: 60%;
            background: linear-gradient(180deg, transparent 0%, rgba(91,156,245,0.03) 50%, transparent 100%);
            animation: scan 3s ease-in-out infinite;
        }
        @keyframes scan { 0%,100% { top: -60%; } 50% { top: 100%; } }
    </style>
</head>
<body class="min-h-screen font-ui antialiased">

<!--  LOGIN SCREEN  -->
<div id="login-screen" class="login-scene">
    <div class="login-bg-orb" style="width:400px;height:400px;top:20%;left:-10%;background:var(--va-accent);"></div>
    <div class="login-bg-orb" style="width:300px;height:300px;bottom:15%;right:-5%;background:#7cb8ff;"></div>

    <div class="login-card glass-panel">
        <div class="scanline"></div>
        <div style="margin-bottom:32px;">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" style="margin:0 auto 16px;">
                <rect x="4" y="8" width="32" height="24" rx="3" stroke="var(--va-accent)" stroke-width="1.5" fill="none"/>
                <line x1="4" y1="14" x2="36" y2="14" stroke="var(--va-accent)" stroke-width="1" opacity="0.5"/>
                <circle cx="20" cy="20" r="4" stroke="var(--va-accent)" stroke-width="1.5" fill="none"/>
                <path d="M20 24v6M16 30h8" stroke="var(--va-accent)" stroke-width="1" opacity="0.7"/>
            </svg>
            <h1 class="text-2xl font-display font-extrabold tracking-tight mb-1" style="line-height:1.2;">
                B2B <span style="background:linear-gradient(135deg,var(--va-accent),#7cb8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">变现仪表盘</span>
            </h1>
            <p class="text-va-muted text-xs uppercase tracking-widest">Art-Tech Swarm · Financial Command Center</p>
        </div>

        <form id="login-form" autocomplete="off" style="position:relative;z-index:1;">
            <input id="password-input" class="login-input" type="password" placeholder="输入访问密钥" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
            <div class="login-error" id="login-error"></div>
            <button id="login-btn" class="login-btn" type="submit" style="margin-top:16px;">验证身份</button>
        </form>

        <div class="gradient-line" style="margin:24px 0 12px;"></div>
        <a href="./index.html" class="nav-back" style="justify-content:center;">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            返回首页
        </a>
    </div>
</div>

<!--  DASHBOARD (hidden until auth)  -->
<div id="dashboard-screen" style="display:none;">
<div class="max-w-6xl mx-auto px-4 md:px-5 py-8">

    <div class="flex items-center justify-between mb-8">
        <a href="./index.html" class="nav-back">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            返回首页
        </a>
        <span class="glass-chip">Updated 2026-05-07</span>
    </div>

    <div class="mb-10">
        <h1 class="text-4xl md:text-5xl font-display font-extrabold tracking-tight mb-2">
            B2B <span style="background:linear-gradient(135deg,var(--va-accent),#7cb8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">变现仪表盘</span>
        </h1>
        <p class="text-va-muted text-sm uppercase tracking-widest">Art-Tech Swarm · Financial Command Center</p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10" id="kpi-grid"></div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-8" id="breakdown-grid"></div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-8" id="funnel-grid"></div>
    <div class="glass-panel p-6 mb-8" id="detail-table"></div>

    <div class="gradient-line mb-4"></div>
    <p class="text-va-muted text-xs text-center">
        Data source: <code class="text-va-accent/70">financial_ledger.md</code> · Synced via Finance Agent (Ledger - codex) · Art-Tech Swarm © 2026
    </p>
</div>
</div>

<script>
// ── Password verification (SHA-256) ──
const PASSWORD_HASH = 'f4a1579a0eb119bdd1777f2e37b3209f4849e2c8ebf70a4aec08b07af3f29321';
const AUTH_USER = 'papazed';
const SESSION_KEY = 'b2b_auth_v1';
const DATA_URL = './finance_data.json';

async function sha256(input) {
    const encoder = new TextEncoder();
    const data = encoder.encode(input);
    const hash = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function getAuthHeader() {
    const cred = sessionStorage.getItem(SESSION_KEY);
    return cred ? 'Basic ' + btoa(AUTH_USER + ':' + cred) : null;
}

// ── Login ──
const loginScreen = document.getElementById('login-screen');
const dashboardScreen = document.getElementById('dashboard-screen');
const loginForm = document.getElementById('login-form');
const passwordInput = document.getElementById('password-input');
const loginBtn = document.getElementById('login-btn');
const loginError = document.getElementById('login-error');

// Check existing session
(async function checkSession() {
    const saved = sessionStorage.getItem(SESSION_KEY);
    if (saved) {
        const h = await sha256(saved);
        if (h === PASSWORD_HASH) {
            showDashboard();
            return;
        }
    }
    loginScreen.style.display = 'flex';
})();

loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = passwordInput.value;
    if (!pw) { loginError.textContent = '请输入访问密钥'; return; }

    loginBtn.disabled = true;
    loginBtn.textContent = '验证中...';
    loginError.textContent = '';

    // Small delay for UX
    await new Promise(r => setTimeout(r, 600));

    const h = await sha256(pw);
    if (h === PASSWORD_HASH) {
        sessionStorage.setItem(SESSION_KEY, pw);
        loginScreen.style.opacity = '0';
        loginScreen.style.transition = 'opacity 0.4s';
        await new Promise(r => setTimeout(r, 400));
        loginScreen.style.display = 'none';
        showDashboard();
    } else {
        loginError.textContent = '密钥错误，拒绝访问';
        passwordInput.value = '';
        passwordInput.focus();
    }
    loginBtn.disabled = false;
    loginBtn.textContent = '验证身份';
});

async function showDashboard() {
    dashboardScreen.style.display = 'block';
    await loadDashboard();
}

// ── Dashboard ──
async function loadDashboard() {
    const auth = getAuthHeader();
    const resp = await fetch(DATA_URL, { headers: auth ? { Authorization: auth } : {} });
    if (!resp.ok) {
        sessionStorage.removeItem(SESSION_KEY);
        location.reload();
        return;
    }
    const data = await resp.json();
    const { summary, revenue, expenses, funnel, students } = data;

    const kpis = [
        { label: '总营收', value: '¥' + summary.total_revenue.toLocaleString(), sub: 'Net Revenue', color: 'va-accent' },
        { label: '总支出', value: '¥' + summary.total_expenses.toLocaleString(), sub: 'Total Cost', color: 'va-warn' },
        { label: '净盈余', value: '¥' + summary.net_surplus.toLocaleString(), sub: 'Net Surplus', color: 'va-profit' },
        { label: '利润率', value: summary.profit_margin + '%', sub: 'Profit Margin', color: 'va-profit' },
    ];
    document.getElementById('kpi-grid').innerHTML = kpis.map(k => `
        <div class="glass-panel p-5 text-center">
            <div class="kpi-label mb-1">${k.label}</div>
            <div class="kpi-value text-3xl md:text-4xl" style="color:var(--${k.color})">${k.value}</div>
            <div class="text-va-muted text-xs mt-1">${k.sub}</div>
        </div>
    `).join('');

    const revCategories = Object.values(revenue);
    const maxRev = Math.max(...revCategories.map(c => c.subtotal));
    document.getElementById('breakdown-grid').innerHTML = `
        <div class="glass-panel p-6">
            <h3 class="font-display text-xl font-bold mb-4 tracking-tight">收入构成</h3>
            ${revCategories.map(c => `
                <div class="mb-3">
                    <div class="flex justify-between text-sm mb-1"><span>${c.label}</span><span class="font-mono text-va-accent">¥${c.subtotal.toLocaleString()}</span></div>
                    <div class="w-full bg-va-border rounded-full h-[6px]"><div class="bar-fill" style="width:${(c.subtotal/maxRev*100).toFixed(0)}%"></div></div>
                </div>
            `).join('')}
            <div class="gradient-line my-3"></div>
            <div class="flex justify-between text-sm font-bold"><span>总收入</span><span class="font-mono" style="color:var(--va-accent)">¥${summary.total_revenue.toLocaleString()}</span></div>
        </div>
        <div class="glass-panel p-6">
            <h3 class="font-display text-xl font-bold mb-4 tracking-tight">支出明细</h3>
            ${Object.values(expenses).map(cat => `
                <div class="mb-4"><div class="kpi-label mb-2">${cat.label} · ¥${cat.subtotal.toLocaleString()}</div>
                    ${cat.items.map(e => `<div class="flex justify-between text-sm py-1.5 table-row"><span class="text-va-muted">${e.detail}</span><span class="font-mono">¥${e.amount.toLocaleString()}</span></div>`).join('')}
                </div>
            `).join('')}
            <div class="gradient-line my-3"></div>
            <div class="flex justify-between text-sm font-bold"><span>总支出</span><span class="font-mono" style="color:var(--va-warn)">¥${summary.total_expenses.toLocaleString()}</span></div>
        </div>`;

    document.getElementById('funnel-grid').innerHTML = `
        <div class="glass-panel p-6">
            <h3 class="font-display text-xl font-bold mb-4 tracking-tight">变现漏斗</h3>
            <div class="space-y-3">
                ${funnel.tiers.map((t,i) => `
                    <div class="funnel-step" style="margin-left:${i*12}px;opacity:${1-i*0.08}">
                        <div class="flex justify-between items-center"><div><span class="font-bold text-lg">¥${t.price}</span><span class="text-va-muted text-sm ml-2">${t.name}</span></div><span class="glass-chip">${t.conversion||(t.students?t.students+' 学员':'')}</span></div>
                        <div class="text-va-muted text-xs mt-1">${t.product}</div>
                    </div>
                `).join('')}
            </div>
        </div>
        <div class="glass-panel p-6">
            <h3 class="font-display text-xl font-bold mb-4 tracking-tight">学员统计</h3>
            <div class="text-center mb-4"><div class="kpi-value text-5xl" style="color:var(--va-accent)">${students.total}</div><div class="kpi-label">累计学员</div></div>
            <div class="space-y-2">${students.by_tier.map(t => `<div class="flex justify-between items-center py-2 table-row"><span>${t.tier}</span><span class="font-mono font-bold">${t.count} 人</span></div>`).join('')}</div>
            <div class="gradient-line my-3"></div>
            <div class="text-xs text-va-muted">训练营总收入：<span class="font-mono" style="color:var(--va-profit)">¥${revenue.training.subtotal.toLocaleString()}</span></div>
        </div>`;

    const allRevenueItems = [];
    Object.values(revenue).forEach(cat => { cat.items.forEach(item => allRevenueItems.push({...item, category: cat.label})); });
    document.getElementById('detail-table').innerHTML = `
        <h3 class="font-display text-xl font-bold mb-4 tracking-tight">收入明细全览</h3>
        <div class="overflow-x-auto"><table class="w-full text-sm">
            <thead><tr class="text-va-muted text-left text-xs uppercase tracking-wider"><th class="pb-3 pr-4">类别</th><th class="pb-3 pr-4">详情</th><th class="pb-3 pr-4 text-right">金额</th><th class="pb-3 text-right">备注</th></tr></thead>
            <tbody>${allRevenueItems.map(item => `<tr class="table-row"><td class="py-2 pr-4"><span class="glass-chip">${item.category}</span></td><td class="py-2 pr-4">${item.detail||item.client||'-'}</td><td class="py-2 pr-4 text-right font-mono">¥${(item.net||item.amount).toLocaleString()}</td><td class="py-2 text-right text-va-muted text-xs">${item.note||'-'}</td></tr>`).join('')}</tbody>
        </table></div>
        <div class="gradient-line my-4"></div>
        <div class="flex justify-end gap-6 text-sm"><span class="text-va-muted">总营收</span><span class="font-mono font-bold" style="color:var(--va-accent)">¥${summary.total_revenue.toLocaleString()}</span><span class="profit-badge">净利 ¥${summary.net_surplus.toLocaleString()}</span></div>`;
}
</script>
</body>
</html>
