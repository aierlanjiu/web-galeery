<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script>
        (function () {
            function loadUmami() {
                if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(window.location.hostname)) return;
                window.setTimeout(function () {
                    var script = document.createElement('script');
                    script.src = 'https://cloud.umami.is/script.js';
                    script.async = true;
                    script.setAttribute('data-website-id', '4c8af0ff-2c1f-44b7-8be6-e10b40863459');
                    script.onerror = function () { if (script.parentNode) script.parentNode.removeChild(script); };
                    document.head.appendChild(script);
                }, 1200);
            }
            if (document.readyState === 'complete') loadUmami();
            else window.addEventListener('load', loadUmami);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAILY NEWS | 雪沐江南 · 前沿观察</title>

    <script>
        (function () {
            try {
                var stored = window.localStorage.getItem('web-gallery-theme');
                var theme = stored === 'dark' || stored === 'light'
                    ? stored
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (error) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <script crossorigin src="./vendor/react.production.min.js"></script>
    <script crossorigin src="./vendor/react-dom.production.min.js"></script>
    <script src="./vendor/babel.min.js"></script>
    <script src="./vendor/tailwindcss-3.4.17.js"></script>
    <script src="./vendor/framer-motion.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Oswald:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/liquid-glass.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'va-base': '#070b13',
                        'va-mercury': '#9dc6df',
                        'va-rose': '#c99f83',
                        'va-ink': '#eef3f8',
                    },
                    fontFamily: {
                        display: ['Oswald', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        body: ['Noto Sans SC', 'sans-serif'],
                    },
                    animation: {
                        'blob1': 'blobMorph1 20s ease-in-out infinite',
                        'blob2': 'blobMorph2 25s ease-in-out infinite',
                        'blob3': 'blobMorph3 30s ease-in-out infinite',
                    },
                    keyframes: {
                        blobMorph1: { '0%,100%': { borderRadius: '40% 60% 60% 40% / 40% 60% 40% 60%', transform: 'translate(0,0) rotate(0deg) scale(1)' }, '33%': { borderRadius: '60% 40% 40% 60% / 60% 40% 60% 40%', transform: 'translate(3%,-2%) rotate(120deg) scale(1.05)' }, '66%': { borderRadius: '50% 50% 40% 60% / 30% 60% 50% 70%', transform: 'translate(-2%,3%) rotate(240deg) scale(0.95)' } },
                        blobMorph2: { '0%,100%': { borderRadius: '60% 40% 30% 70% / 60% 30% 70% 40%', transform: 'translate(0,0) rotate(0deg) scale(1)' }, '50%': { borderRadius: '30% 60% 70% 40% / 50% 60% 30% 60%', transform: 'translate(-4%,5%) rotate(-180deg) scale(1.08)' } },
                        blobMorph3: { '0%,100%': { borderRadius: '50% 50% 50% 50% / 50% 50% 50% 50%', transform: 'translate(0,0) rotate(0deg) scale(1)' }, '25%': { borderRadius: '70% 30% 50% 50% / 30% 70% 50% 50%', transform: 'translate(5%,3%) rotate(90deg) scale(0.93)' }, '75%': { borderRadius: '30% 70% 50% 50% / 70% 30% 50% 50%', transform: 'translate(-3%,-5%) rotate(270deg) scale(1.07)' } },
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;
        const THEME_KEY = "web-gallery-theme";

        function getInitialTheme() {
            try {
                const stored = window.localStorage.getItem(THEME_KEY);
                if (stored === "dark" || stored === "light") return stored;
            } catch (error) { console.warn("theme storage unavailable", error); }
            return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        function applyTheme(theme) { document.documentElement.setAttribute("data-theme", theme); }
        async function loadJson(path, cacheBust = false) {
            const url = cacheBust ? `${path}?t=${Date.now()}` : path;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`${path} failed with ${response.status}`);
            return response.json();
        }
        const SvgIcon = ({ name, className = "w-4 h-4" }) => {
            const common = { fill: "none", viewBox: "0 0 24 24", stroke: "currentColor", strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round", className };
            const paths = {
                sun: <><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></>,
                moon: <path d="M21 12.8A8.5 8.5 0 1111.2 3 6.6 6.6 0 0021 12.8z"/>,
                arrow: <path d="M5 12h14M13 5l7 7-7 7"/>,
                close: <path d="M6 18L18 6M6 6l12 12"/>,
                external: <><path d="M7 17L17 7"/><path d="M9 7h8v8"/></>,
            };
            return <svg {...common}>{paths[name] || paths.arrow}</svg>;
        };


        // UI-Layouts adapted helpers: LiquidGlassCard + SpotlightItem
        // Original inspiration: ui-layouts Liquid Glass / Spotlight Cards. Adapted for static React+Babel.
        const LiquidGlassCard = ({ children, className = "", blurIntensity = "xl", glowIntensity = "sm", shadowIntensity = "md", borderRadius = "32px", ...props }) => {
            const [spot, setSpot] = useState({ x: "18%", y: "0%" });
            const blurMap = { sm: "24px", md: "34px", lg: "42px", xl: "54px" };
            const glowMap = { none: "0px", xs: "14px", sm: "28px", md: "40px", lg: "54px", xl: "70px" };
            const insetMap = { none: "0px", xs: "1px", sm: "2px", md: "3px", lg: "4px", xl: "6px" };
            const handleMove = (event) => {
                const rect = event.currentTarget.getBoundingClientRect();
                setSpot({ x: `${event.clientX - rect.left}px`, y: `${event.clientY - rect.top}px` });
            };
            return <div className={`ui-liquid-card ${className}`} style={{ "--ui-liquid-radius": borderRadius, "--ui-liquid-blur": blurMap[blurIntensity] || blurMap.xl, "--ui-liquid-glow": glowMap[glowIntensity] || glowMap.sm, "--ui-liquid-inset": insetMap[shadowIntensity] || insetMap.md, "--spot-x": spot.x, "--spot-y": spot.y, borderRadius }} onMouseMove={handleMove} {...props}><div className="ui-liquid-content">{children}</div></div>;
        };
        const SpotlightItem = ({ children, className = "" }) => {
            const [spot, setSpot] = useState({ x: "50%", y: "50%" });
            const handleMove = (event) => {
                const rect = event.currentTarget.getBoundingClientRect();
                setSpot({ x: `${event.clientX - rect.left}px`, y: `${event.clientY - rect.top}px` });
            };
            return <div className={`ui-spotlight ${className}`} style={{ "--spot-x": spot.x, "--spot-y": spot.y }} onMouseMove={handleMove}>{children}</div>;
        };

        const ThemeToggle = ({ theme, onToggle }) => (
            <button className="theme-toggle glass-chip" onClick={onToggle} type="button" aria-label={theme === "dark" ? "切换浅色模式" : "切换深色模式"}>
                {theme === "dark" ? <SvgIcon name="sun"/> : <SvgIcon name="moon"/>}
            </button>
        );

        const Header = ({ theme, toggleTheme, latestDate, totalItems }) => (
            <motion.header initial={{ opacity: 0, y: -18 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.7, ease: [0.22,1,0.36,1] }} className="max-w-7xl mx-auto mt-6 mb-10 px-4 md:mt-12 md:mb-14 md:px-5 grid grid-cols-1 lg:grid-cols-3 gap-6">
                <LiquidGlassCard className="metal-card min-h-[300px] md:min-h-[380px] p-7 md:p-10 flex flex-col justify-between overflow-hidden lg:col-span-2" borderRadius="28px" blurIntensity="xl" glowIntensity="md" shadowIntensity="lg">
                    <div className="flex items-start justify-between gap-4 relative z-10">
                        <div className="font-mono text-[10px] tracking-[0.28em] text-va-mercury uppercase">Daily Intelligence // Liquid Glass</div>
                        <a href="index.html" className="glass-chip rounded-full px-4 py-2 font-mono text-[10px] tracking-widest text-white/60 hover:text-white transition-colors flex items-center gap-2">BACK TO VA <SvgIcon name="arrow" className="w-3 h-3"/></a>
                    </div>
                    <div className="relative z-10">
                        <h1 className="hero-title font-display text-5xl md:text-7xl tracking-tight leading-none"><span className="hero-word">DAILY</span><span className="hero-word text-va-mercury">NEWS</span></h1>
                        <p className="font-mono text-[11px] text-white/45 tracking-[0.32em] mt-4 uppercase">Automotive · Tech · Industrial Frontier</p>
                    </div>
                </LiquidGlassCard>
                <LiquidGlassCard className="metal-card p-6 md:p-8 relative flex flex-col justify-center" borderRadius="28px" blurIntensity="lg" glowIntensity="sm" shadowIntensity="md">
                    <div className="absolute -top-0.5 right-3 z-20"><ThemeToggle theme={theme} onToggle={toggleTheme}/></div>
                    <div className="space-y-4 font-mono text-xs relative z-10 pt-14">
                        <div className="flex justify-between border-b border-white/10 pb-2"><span className="text-white/50">新闻批次</span><span className="text-va-mercury font-bold">{totalItems}</span></div>
                        <div className="flex justify-between border-b border-white/10 pb-2"><span className="text-white/50">最新日期</span><span className="text-white/70">{latestDate || 'LOADING'}</span></div>
                        <div className="pt-4 text-white/40 leading-relaxed">同步主页 Xuemulab Liquid Glass 视觉规范：深色玻璃、冷银蓝高光、克制动效。</div>
                    </div>
                </LiquidGlassCard>
            </motion.header>
        );

        const NewsModal = ({ item, onClose }) => {
            if (!item) return null;
            return (
                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-[120] flex items-center justify-center p-4 md:p-8 ui-media-modal" onClick={onClose}>
                    <motion.div initial={{ scale: 0.96, y: 18 }} animate={{ scale: 1, y: 0 }} className="glass-shell w-full max-w-6xl max-h-[90vh] rounded-3xl overflow-hidden flex flex-col md:flex-row shadow-2xl" onClick={(e) => e.stopPropagation()}>
                        <div className="md:w-[44%] h-72 md:h-auto relative bg-black/30"><img src={item.poster} alt={item.date} className="w-full h-full object-contain"/></div>
                        <div className="md:w-[56%] p-8 md:p-10 overflow-y-auto">
                            <div className="flex justify-between items-start mb-8">
                                <div><div className="text-va-mercury font-mono text-sm mb-2 tracking-widest">{item.date}</div><h2 className="font-display text-3xl text-white">新闻动态</h2></div>
                                <button onClick={onClose} className="theme-toggle glass-chip"><SvgIcon name="close" className="w-5 h-5"/></button>
                            </div>
                            <div className="space-y-3">
                                {item.items.map((news, idx) => (
                                    <a key={idx} href={news.link} target="_blank" rel="noopener noreferrer" className="block p-4 rounded-2xl glass-card hover:bg-white/10 transition-all group">
                                        <div className="flex items-start gap-4"><span className="font-mono text-va-mercury font-bold text-lg opacity-45 group-hover:opacity-100 transition-opacity">{(idx + 1).toString().padStart(2, '0')}</span><div><h3 className="font-bold text-white text-base mb-1 leading-snug group-hover:text-va-mercury transition-colors">{news.title}</h3><p className="text-xs font-mono text-white/40 flex items-center gap-1">{news.source}<SvgIcon name="external" className="w-3 h-3"/></p></div></div>
                                    </a>
                                ))}
                            </div>
                        </div>
                    </motion.div>
                </motion.div>
            );
        };

        const NewsCard = ({ item, onClick, index }) => (
            <motion.div role="button" tabIndex={0} initial={{ opacity: 0, y: 30, scale: 0.97 }} whileInView={{ opacity: 1, y: 0, scale: 1 }} viewport={{ once: true, margin: "-40px" }} transition={{ duration: 0.46, delay: Math.min(index * 0.035, 0.2), ease: [0.22,1,0.36,1] }} onClick={() => onClick(item)} onKeyDown={(event) => { if (event.key === 'Enter' || event.key === ' ') onClick(item); }} className="text-left group cursor-pointer outline-none">
                <SpotlightItem className="rounded-2xl"><LiquidGlassCard className="metal-card overflow-hidden hover:-translate-y-1 transition-all duration-500 shadow-xl" borderRadius="18px" blurIntensity="lg" glowIntensity="xs" shadowIntensity="sm">
                    <div className="aspect-[9/16] relative overflow-hidden bg-black/20"><img src={item.poster} alt={item.date} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-[1.035]"/><div className="absolute bottom-7 left-5 right-5"><div className="font-mono text-[9px] text-white/10 tracking-[0.18em] uppercase leading-relaxed">DAILY BRIEFING · {item.items.length} SIGNALS · Xuemu_lab</div></div></div>
                </LiquidGlassCard></SpotlightItem>
            </motion.div>
        );

        const App = () => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedItem, setSelectedItem] = useState(null);
            const [theme, setTheme] = useState(getInitialTheme);
            useEffect(() => applyTheme(theme), [theme]);
            const toggleTheme = () => setTheme((current) => { const next = current === "dark" ? "light" : "dark"; try { window.localStorage.setItem(THEME_KEY, next); } catch (error) { console.warn(error); } return next; });
            useEffect(() => { loadJson('./news_data.json', true).then(setData).catch(console.error).finally(() => setLoading(false)); }, []);
            return (
                <div className={`${theme === "dark" ? 'dark' : ''}`}>
                    <div className="min-h-screen flex flex-col relative transition-colors duration-700 bg-va-base text-va-ink overflow-hidden">
                        <div className="liquid-stage"><div className="liquid-metal-overlay"></div><div className="liquid-blob liquid-blob-1 animate-blob1"></div><div className="liquid-blob liquid-blob-2 animate-blob2"></div><div className="liquid-blob liquid-blob-3 animate-blob3"></div></div>
                        <div className="fixed inset-0 pointer-events-none z-[1]" style={{ background: 'radial-gradient(ellipse at 50% 50%, transparent 58%, rgba(8,12,20,0.34) 100%)' }}></div>
                        <div className="relative z-10">
                            <Header theme={theme} toggleTheme={toggleTheme} latestDate={data[0]?.date} totalItems={data.length}/>
                            <main className="max-w-7xl mx-auto px-4 md:px-5 pb-20 w-full">
                                {loading ? <div className="text-center font-mono text-va-mercury/60 mt-20">LOADING NEWS FEED...</div> : <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">{data.map((item, index) => <NewsCard key={item.id || item.date} item={item} index={index} onClick={setSelectedItem}/>)}</div>}
                            </main>
                            <AnimatePresence>{selectedItem && <NewsModal item={selectedItem} onClose={() => setSelectedItem(null)}/>}</AnimatePresence>
                            <footer className="mt-10 border-t border-white/10 py-8 text-center"><p className="font-mono text-[10px] text-va-mercury tracking-widest opacity-50">雪沐江南 · 前沿观察</p><p className="font-mono text-[10px] text-white/30 mt-0.5">&copy; 2026 SNOWY LABS</p></footer>
                        </div>
                    </div>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
